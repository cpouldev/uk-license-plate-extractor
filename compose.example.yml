services:
  plate-extractor:
    build:
      context: .
    image: uk-license-plate-extractor:local
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      MAX_REQUEST_BYTES: "${MAX_REQUEST_BYTES:-52428800}"
      MAX_IMAGE_BYTES: "${MAX_IMAGE_BYTES:-15728640}"
      MAX_IMAGES: "${MAX_IMAGES:-20}"
